<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zitto Feedback Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <button class="open-btn" id="openBtn" type="button" hidden>Leave feedback</button>

  <main class="card" id="card" role="dialog" aria-labelledby="cardTitle">
    <header class="card__header">
      <div class="card__brand">
        <span class="card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z" />
            <path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1" />
          </svg>
        </span>
        <h1 id="cardTitle">Leave a feedback</h1>
      </div>
      <button class="close-btn" id="closeBtn" type="button" aria-label="Close feedback">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </header>

    <!-- Form view -->
    <form class="card__body" id="feedbackForm" novalidate>
      <h2 class="card__question">How do you feel about Zitto?</h2>
      <p class="card__sub">Your feedback is valuable to us and helps Zitto improve our services</p>

      <div class="moods" id="moods" role="radiogroup" aria-label="Choose how you feel">
        <button type="button" class="mood" role="radio" aria-checked="false" aria-label="Angry"     data-mood="angry"   title="Angry">😡</button>
        <button type="button" class="mood" role="radio" aria-checked="false" aria-label="Sad"       data-mood="sad"     title="Sad">😢</button>
        <button type="button" class="mood" role="radio" aria-checked="false" aria-label="Neutral"   data-mood="neutral" title="Neutral">😐</button>
        <button type="button" class="mood" role="radio" aria-checked="false" aria-label="Happy"     data-mood="happy"   title="Happy">😊</button>
        <button type="button" class="mood" role="radio" aria-checked="false" aria-label="Love it"   data-mood="love"    title="Love it">😍</button>
      </div>
      <p class="error" id="error" role="alert" aria-live="polite"></p>

      <textarea id="comment" name="comment" placeholder="Leave a comment..." maxlength="500" aria-label="Comment"></textarea>

      <button class="submit" id="submitBtn" type="submit" data-mood="happy">Submit</button>
    </form>

    <!-- Success view -->
    <div class="card__body success" id="success" hidden>
      <div class="success__emoji" id="successEmoji" aria-hidden="true">😊</div>
      <h2 class="card__question">Thank you!</h2>
      <p class="card__sub" id="successMsg">Your feedback has been received.</p>
      <button class="submit" id="againBtn" type="button" data-mood="happy">Send another</button>
    </div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
